<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.A.O.S — Ficha de Personagem</title>
<link rel="stylesheet" href="./style.css">
<style>
  .id-grid{ display:grid; grid-template-columns:2fr 1fr 1fr; gap:14px; }
  .identidade-corpo{
    display:grid; grid-template-columns:auto 2.2fr 1fr 1fr; align-items:stretch;
    margin-top:16px; padding-top:16px; border-top:1px solid var(--border-soft);
  }
  .identidade-col{
    display:flex; flex-direction:column; justify-content:space-between; gap:14px;
    padding:0 20px; border-left:1px solid var(--border-soft);
  }
  .identidade-col-avatar{ border-left:none; padding-left:0; align-items:center; justify-content:center; }
  .avatar-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .avatar-circle{
    width:160px; height:160px; border-radius:50%; background:var(--bg-inset);
    border:2px solid var(--border-soft); display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden;
  }
  .avatar-circle:hover{ border-color:var(--accent-arcane); }
  .avatar-circle img{ width:100%; height:100%; object-fit:cover; display:block; }
  #avatar-placeholder{ font-size:0.78rem; color:var(--text-faint); text-align:center; padding:0 12px; }
  .avatar-remove{ background:none; border:none; color:var(--text-faint); font-size:0.66rem; cursor:pointer; text-decoration:underline; padding:0; }
  .avatar-remove:hover{ color:var(--accent-ember); }

  @media (max-width:640px){
    .identidade-corpo{ grid-template-columns:1fr; }
    .identidade-col{ border-left:none; border-top:1px solid var(--border-soft); padding:14px 0 0; align-items:center; text-align:center; }
    .identidade-col-avatar{ border-top:none; padding-top:0; }
    .id-grid{ grid-template-columns:1fr; }
  }

  .nivel-stepper{ display:flex; align-items:center; gap:8px; }
  .nivel-stepper input{ width:56px; text-align:center; }
  .step-btn{
    width:30px; height:30px; border-radius:6px; border:1px solid var(--border-soft);
    background:var(--bg-panel-alt); color:var(--text); cursor:pointer; font-size:1rem; line-height:1;
  }
  .step-btn:hover{ border-color:var(--accent-arcane); color:var(--accent-arcane); }

  .vitals-grid{ display:grid; grid-template-columns:1.6fr 1fr; grid-auto-rows:1fr; gap:12px; }
  .vital-card{ background:var(--bg-panel-alt); border:1px solid var(--border-soft); border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  .vital-top-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .vital-left{ display:flex; align-items:center; gap:10px; }
  .vital-card-label{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); }
  .vital-inputs{ display:flex; align-items:center; gap:4px; }
  .vital-inputs input{ width:52px; text-align:center; font-family:var(--font-mono); font-size:0.95rem; padding:6px 4px; }
  .vital-inputs .slash{ color:var(--text-faint); font-family:var(--font-mono); }
  .vital-card.protecao-card .vital-card-label{ color:var(--accent-arcane); }
  .dano-cura-row{ display:flex; align-items:center; gap:5px; }
  .dano-cura-row input{ width:44px; text-align:center; font-family:var(--font-mono); font-size:0.78rem; padding:6px 4px; }
  .dc-btn{ background:var(--bg-inset); border:1px solid var(--border-soft); color:var(--text); border-radius:6px; padding:6px 10px; font-size:0.74rem; cursor:pointer; }
  .dc-btn.dano{ border-color:var(--accent-ember); color:var(--accent-ember); }
  .dc-btn.dano:hover{ background:rgba(226,89,63,0.15); }
  .dc-btn.cura{ border-color:#6fbf73; color:#6fbf73; }
  .dc-btn.cura:hover{ background:rgba(111,191,115,0.12); }

  .derived-card{ background:var(--bg-panel-alt); border:1px solid var(--border-soft); border-radius:8px; padding:16px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .derived-label{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:10px; }
  .derived-card input{ width:88px; text-align:center; font-family:var(--font-display); font-size:1.4rem; font-weight:600; color:var(--accent-gold); padding:8px 6px; }

  .attr-grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; }
  .attr-mode-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .mode-toggle-btn{ background:var(--bg-inset); border:1px solid var(--border-soft); color:var(--text-dim); border-radius:20px; padding:6px 14px; font-size:0.74rem; cursor:pointer; }
  .mode-toggle-btn[data-modo="temporario"]{ border-color:var(--accent-arcane); color:var(--accent-arcane); background:rgba(155,107,242,0.1); }
  .attr-clear-all{ background:none; border:none; color:var(--text-faint); font-size:0.72rem; cursor:pointer; text-decoration:underline; }
  .attr-clear-all:hover{ color:var(--accent-ember); }
  .attr-card{ background:var(--bg-panel-alt); border:1px solid var(--border-soft); border-radius:8px; padding:8px 4px; text-align:center; }
  .attr-card.fisica{ border-top:2px solid var(--accent-ember); }
  .attr-card.mental{ border-top:2px solid var(--accent-arcane); }
  .attr-name{ font-size:0.62rem; text-transform:uppercase; color:var(--text-dim); margin-bottom:4px; }
  .attr-value{ font-family:var(--font-display); font-size:1.25rem; font-weight:600; }
  .attr-value .efetivo.buff{ color:#4fd57a; }
  .attr-value .efetivo.debuff{ color:var(--accent-ember); }
  .attr-dice{ font-family:var(--font-mono); font-size:0.66rem; color:var(--text-faint); margin-bottom:6px; }
  .attr-controls{ display:flex; justify-content:center; gap:4px; }
  .attr-controls .step-btn{ width:22px; height:22px; font-size:0.85rem; padding:0; }

  .tabbar{ display:flex; align-items:center; gap:18px; margin-bottom:16px; flex-wrap:wrap; }
  .tab-btn{ background:transparent; border:1px solid transparent; color:var(--text-faint); font-size:0.74rem; text-transform:uppercase; font-weight:600; padding:8px 14px; border-radius:6px; cursor:pointer; }
  .tab-btn:hover{ color:var(--text-dim); }
  .tab-btn.active{ color:var(--text); border-color:var(--text); background:var(--bg-inset); }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; }
  .tab-placeholder{ color:var(--text-faint); font-size:0.86rem; padding:20px 0; text-align:center; }

  .pericia-cat{ margin-bottom:18px; }
  .pericia-cat-label{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); margin:0 0 8px; border-bottom:1px solid var(--border-soft); padding-bottom:6px; }
  .pericia-row{ display:grid; grid-template-columns:1fr auto auto auto auto; gap:10px; align-items:center; padding:8px 6px; border-radius:6px; font-size:0.86rem; }
  .pericia-row:hover{ background:var(--bg-panel-alt); }
  .pericia-nome{ display:flex; flex-direction:column; }
  .pericia-nome span.attrtag{ font-size:0.66rem; color:var(--text-faint); text-transform:uppercase; }
  .toggle{ display:flex; align-items:center; gap:5px; font-size:0.72rem; color:var(--text-dim); cursor:pointer; }
  .toggle input{ accent-color:var(--accent-arcane); width:14px; height:14px; }
  .formula{ font-family:var(--font-mono); font-size:0.78rem; color:var(--accent-gold); min-width:110px; text-align:right; }
  .roll-btn{ background:var(--accent-arcane-dim); border:1px solid var(--accent-arcane); color:var(--text); border-radius:6px; padding:6px 12px; font-size:0.76rem; cursor:pointer; }
  .roll-btn:hover{ background:var(--accent-arcane); }
  .roll-btn.oficio{ background:var(--bg-inset); border-color:var(--accent-gold); color:var(--accent-gold); }

  .item-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .item-list{ display:flex; flex-direction:column; gap:10px; }
  .item-card{ background:var(--bg-panel-alt); border:1px solid var(--border-soft); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; }
  .item-card.expandido{ grid-column:1 / -1; }
  .item-header{ display:flex; align-items:baseline; gap:8px; cursor:pointer; }
  .item-chevron{ color:var(--text-faint); font-size:0.7rem; width:12px; }
  .item-nome{ font-family:var(--font-display); font-size:1rem; font-weight:600; }
  .item-peso, .item-meta, .atalho-formula{ margin-left:auto; font-size:0.72rem; color:var(--text-faint); font-family:var(--font-mono); }
  .item-body{ margin-top:10px; padding-top:10px; border-top:1px solid var(--border-soft); }
  .item-desc-text{ font-size:0.84rem; color:var(--text-dim); font-style:italic; white-space:pre-wrap; }
  .item-footer-actions{ display:flex; justify-content:space-between; margin-top:12px; }
  .item-action{ background:none; border:none; font-size:0.78rem; cursor:pointer; padding:2px 4px; }
  .item-action.remover{ color:var(--accent-ember); }
  .item-action.editar{ color:#4fd57a; }
  .item-add-card{ grid-column:1 / -1; background:var(--bg-panel-alt); border:1px dashed var(--border-soft); border-radius:8px; padding:16px; display:flex; align-items:center; justify-content:center; min-height:60px; cursor:pointer; color:var(--text-dim); }
  .item-add-card:hover{ border-color:var(--accent-arcane); color:var(--text); }
  .item-add-form, .item-edit-form{ grid-column:1 / -1; background:var(--bg-panel-alt); border:1px solid var(--border-soft); border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .item-form-row{ display:flex; gap:8px; }
  .item-tipo-tag, .item-raridade-tag{ font-size:0.68rem; text-transform:uppercase; font-weight:600; margin-bottom:6px; }
  .tipo-herdada, .tipo-tecnica, .raridade-raro{ color:#4d9eea; }
  .tipo-extranatural, .tipo-aprimoramento, .tipo-estilo, .raridade-muitoraro{ color:#e5484d; }
  .tipo-classe, .raridade-lendario{ color:#f0c419; }
  .tipo-talento, .raridade-incomum{ color:#4fd57a; }
  .raridade-comum{ color:#e9e4f2; }
  .raridade-epico{ color:#a56bf2; }

  .dado-row{ display:flex; gap:8px; align-items:center; }
  .dado-row-remover{ background:none; border:1px solid var(--border-soft); color:var(--text-faint); border-radius:5px; width:26px; height:26px; font-size:0.8rem; cursor:pointer; }
  .btn-add-dado{ background:none; border:1px dashed var(--border-soft); color:var(--text-dim); border-radius:6px; padding:6px; font-size:0.76rem; cursor:pointer; }
  .atalho-rolar-btn{ background:var(--accent-arcane-dim); border:1px solid var(--accent-arcane); color:var(--text); border-radius:6px; padding:5px 12px; font-size:0.76rem; cursor:pointer; }

  .anotacoes-grid{ display:grid; grid-template-columns:1fr 1.6fr; gap:14px; height:460px; }
  .anotacoes-col{ display:flex; flex-direction:column; background:var(--bg-inset); border:1px solid var(--border-soft); border-radius:8px; padding:12px; }
  .anotacao-item{ display:flex; align-items:center; gap:6px; background:var(--bg-panel-alt); border:1px solid var(--border-soft); border-radius:7px; padding:8px 10px; cursor:pointer; margin-bottom:6px; }
  .anotacao-item.selecionada{ border-color:var(--accent-arcane); background:var(--bg-inset); }
  .anotacao-item-titulo{ flex:1; font-size:0.82rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .anotacao-titulo-input{ background:transparent; border:none; border-bottom:1px solid var(--border-soft); color:var(--text); font-family:var(--font-display); font-size:1.05rem; padding:14px 16px 10px; }
  .anotacao-conteudo-input{ flex:1; background:transparent; border:none; color:var(--text); padding:12px 16px; resize:none; }

  .actions{ position:sticky; bottom:0; display:flex; gap:10px; justify-content:flex-end; padding:14px 0 4px; }
  .mesa-panel{ padding:14px 20px; display:flex; align-items:center; }
  .mesa-form{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; width:100%; }

  .personagem-card{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg-panel-alt); border:1px solid var(--border-soft); border-radius:8px; padding:10px 12px; }
  .personagem-card.ativo{ border-color:var(--accent-arcane); background:rgba(155,107,242,0.08); }
  .personagem-card-info{ flex:1; cursor:pointer; min-width:0; }
  .personagem-card-nome{ font-family:var(--font-display); font-size:0.95rem; color:var(--text); }
  .personagem-card-tag{ font-size:0.6rem; text-transform:uppercase; color:var(--accent-arcane); border:1px solid var(--accent-arcane); border-radius:4px; padding:1px 5px; margin-left:6px; }
  .personagem-card-meta{ font-size:0.74rem; color:var(--text-faint); margin-top:2px; }
  .personagem-card-excluir{ background:none; border:1px solid var(--border-soft); color:var(--text-faint); border-radius:5px; width:24px; height:24px; font-size:0.8rem; cursor:pointer; }
  .personagem-card-excluir:hover{ border-color:var(--accent-ember); color:var(--accent-ember); }

  .historico-item{ background:var(--bg-panel-alt); border:1px solid var(--border-soft); border-radius:8px; padding:10px 12px; display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .crop-panel{ max-width:360px; }
  .crop-viewport{ width:260px; height:260px; border-radius:50%; overflow:hidden; position:relative; background:var(--bg-inset); border:2px solid var(--accent-arcane); margin:4px auto 0; cursor:grab; }
  .crop-viewport.arrastando{ cursor:grabbing; }
  .crop-viewport img{ position:absolute; top:50%; left:50%; max-width:none; pointer-events:none; user-select:none; }
</style>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <div class="masthead-title">C.<span>A</span>.O.S</div>
      <div class="masthead-sub">Ficha de Personagem Automatizada</div>
    </div>
    <div class="masthead-actions">
      <button class="btn" id="btn-historico">Histórico</button>
      <button class="btn" id="btn-personagens">Personagens</button>
    </div>
  </header>

  <!-- Painel de Conexão com a Mesa -->
  <section class="panel mesa-panel">
    <div class="mesa-form" id="mesa-form">
      <label class="field" style="width:240px;">ID da Mesa
        <input type="text" id="f-id-mesa" placeholder="Ex: MESA-8492">
      </label>
      <button class="btn primary" id="btn-entrar-mesa">Entrar na Mesa</button>
    </div>
    <div id="mesa-status" style="display:none; align-items:center; gap:14px; width:100%; justify-content:space-between;">
      <span>Conectado à mesa <b id="mesa-status-id" style="color:var(--accent-gold); font-family:var(--font-mono);"></b></span>
      <button class="btn" id="btn-sair-mesa">Sair da mesa</button>
    </div>
  </section>

  <!-- Modal: Personagens -->
  <div class="modal-overlay" id="modal-personagens">
    <div class="modal-panel">
      <div class="modal-header"><h2 class="panel-title" style="margin:0">Personagens</h2><button class="modal-close" id="btn-fechar-modal">×</button></div>
      <div class="modal-body" id="lista-personagens"></div>
      <div class="modal-footer"><button class="btn primary" id="btn-novo-personagem" style="width:100%;">+ Novo personagem</button></div>
    </div>
  </div>

  <!-- Modal: Histórico de Rolagens -->
  <div class="modal-overlay" id="modal-historico">
    <div class="modal-panel">
      <div class="modal-header"><h2 class="panel-title" style="margin:0">Histórico de Rolagens</h2><button class="modal-close" id="btn-fechar-historico">×</button></div>
      <div class="modal-body" id="lista-historico"></div>
      <div class="modal-footer"><button class="btn" id="btn-limpar-historico">Limpar histórico</button></div>
    </div>
  </div>

  <!-- Modal: Recorte de Foto -->
  <div class="modal-overlay" id="modal-editar-foto">
    <div class="modal-panel crop-panel">
      <div class="modal-header"><h2 class="panel-title" style="margin:0">Editar Foto</h2><button class="modal-close" id="btn-fechar-crop">×</button></div>
      <div class="modal-body" style="align-items:center;">
        <div class="crop-viewport" id="crop-viewport"><img id="crop-image" alt=""></div>
        <input type="range" id="crop-zoom-slider" min="100" max="300" value="100" style="width:100%; margin-top:14px; accent-color:var(--accent-arcane);">
      </div>
      <div class="modal-footer"><button class="btn primary" id="btn-aplicar-crop">Aplicar</button></div>
    </div>
  </div>

  <!-- Grid Principal -->
  <div class="layout-grid">
    <!-- Coluna Esquerda -->
    <div class="layout-col">
      <section class="panel">
        <div class="tabbar" id="tabbar">
          <button class="tab-btn active" data-tab="pericias">Perícias</button>
          <button class="tab-btn" data-tab="inventario">Inventário</button>
          <button class="tab-btn" data-tab="habilidades">Habilidades</button>
          <button class="tab-btn" data-tab="tecnicas">Técnicas</button>
          <button class="tab-btn" data-tab="talentos">Talentos</button>
          <button class="tab-btn" data-tab="atalhos">Atalhos</button>
          <button class="tab-btn" data-tab="anotacoes">Anotações</button>
        </div>

        <div class="tab-content active" data-tab-content="pericias">
          <div class="pericia-cat"><div class="pericia-cat-label">Físicas</div><div id="pericias-fisicas"></div></div>
          <div class="pericia-cat"><div class="pericia-cat-label">Mentais</div><div id="pericias-mentais"></div></div>
          <div class="pericia-cat"><div class="pericia-cat-label">Ofício</div><div id="pericias-oficio"></div></div>
        </div>

        <div class="tab-content" data-tab-content="inventario"><div class="item-grid" id="item-grid"></div></div>
        <div class="tab-content" data-tab-content="habilidades"><div class="item-grid" id="hab-grid"></div></div>
        <div class="tab-content" data-tab-content="tecnicas"><div class="item-list" id="tecnica-grid"></div></div>
        <div class="tab-content" data-tab-content="talentos"><div class="item-grid" id="talento-grid"></div></div>
        <div class="tab-content" data-tab-content="atalhos"><div class="item-list" id="atalho-grid"></div></div>

        <div class="tab-content" data-tab-content="anotacoes">
          <div class="anotacoes-grid">
            <div class="anotacoes-col">
              <button class="btn small primary" id="btn-nova-anotacao" style="margin-bottom:10px;">+ Nova nota</button>
              <div id="anotacoes-lista" style="flex:1; overflow-y:auto;"></div>
            </div>
            <div class="anotacoes-col" style="padding:0; overflow:hidden;">
              <input type="text" id="anotacao-titulo-input" class="anotacao-titulo-input" placeholder="Título da nota" style="display:none;">
              <textarea id="anotacao-conteudo-input" class="anotacao-conteudo-input" placeholder="Escreva aqui..." style="display:none;"></textarea>
              <div class="tab-placeholder" id="anotacao-vazio" style="flex:1; display:flex; align-items:center; justify-content:center;">Selecione uma nota ao lado, ou crie uma nova.</div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Coluna Direita -->
    <div class="layout-col">
      <section class="panel">
        <h2 class="panel-title">Identidade</h2>
        <div class="id-grid">
          <label class="field">Nome<input type="text" id="f-nome"></label>
          <label class="field">Classe<select id="f-classe"><option>Sicário</option><option>Mandrake</option><option>Baluarte</option><option>Valhacouto</option></select></label>
          <label class="field">Subclasse<select id="f-subclasse"><option>Arcanista</option><option>Dizimador</option><option>Colosso</option><option>Protetor</option></select></label>
        </div>
        <div class="identidade-corpo">
          <div class="identidade-col identidade-col-avatar">
            <div class="avatar-wrap">
              <div class="avatar-circle" id="avatar-circle">
                <img id="avatar-img" style="display:none" alt="">
                <span id="avatar-placeholder">+ Foto</span>
              </div>
              <input type="file" id="avatar-input" accept="image/*" style="display:none">
              <button class="avatar-remove" id="avatar-remove" style="display:none">Remover</button>
            </div>
          </div>
          <div class="identidade-col">
            <label class="field">Antecedente<input type="text" id="f-antecedente"></label>
            <label class="field">Ofício
              <select id="f-oficio">
                <option value="">— nenhum —</option><option>Alquimia</option><option>Arte da Guerra</option><option>Ferraria</option><option>Carpintaria</option><option>Culinária</option><option>Escultura</option><option>Herborismo</option><option>Lapidar</option><option>Metalurgia</option><option>Pintura</option><option>Relojoaria</option><option>Sapataria</option><option>Tecelagem</option><option>Engenharia</option>
              </select>
            </label>
          </div>
          <div class="identidade-col">
            <label class="field">Proficiência
              <div class="nivel-stepper">
                <button class="step-btn" data-prof-step="-1">–</button>
                <input type="number" id="f-proficiencia" min="0" max="20" value="1">
                <button class="step-btn" data-prof-step="1">+</button>
              </div>
            </label>
            <label class="field">Nível
              <div class="nivel-stepper">
                <button class="step-btn" data-nivel-step="-1">–</button>
                <input type="number" id="f-nivel" min="1" max="20" value="1">
                <button class="step-btn" data-nivel-step="1">+</button>
              </div>
            </label>
          </div>
          <div class="identidade-col">
            <label class="field">Cansaço
              <div class="nivel-stepper">
                <button class="step-btn" data-cansaco-step="-1">–</button>
                <input type="number" id="f-cansaco" min="0" value="0">
                <button class="step-btn" data-cansaco-step="1">+</button>

            <label class="field">Exaustão
              <div class="nivel-stepper">
                <button class="step-btn" data-exaustao-step="-1">–</button>
                <input type="number" id="f-exaustao" min="0" value="0">
                <button class="step-btn" data-exaustao-step="1">+</button>
              </div>
            </label>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Status Vitais e Combate</h2>
        <div class="vitals-grid">
          <div class="vital-card">
            <div class="vital-top-row">
              <div class="vital-left">
                <span class="vital-card-label">Vida</span>
                <div class="vital-inputs"><input type="number" id="v-pv-atual"><span class="slash">/</span><input type="number" id="v-pv-max"></div>

                <input type="number" id="v-pv-delta" placeholder="Qtd">
                <button class="dc-btn dano" data-vital="pv" data-sinal="-1">Dano</button>
                <button class="dc-btn cura" data-vital="pv" data-sinal="1">Cura</button>
              </div>
            </div>
            <div class="bar-track"><div class="bar-fill vida" id="v-pv-bar" style="width:100%"></div></div>
          </div>
          <div class="derived-card"><span class="derived-label">DT</span><input type="text" id="v-dt"></div>
          <div class="vital-card protecao-card">
            <div class="vital-top-row">
              <div class="vital-left">
                <span class="vital-card-label">Proteção</span>
                <div class="vital-inputs"><input type="number" id="v-prot-atual"><span class="slash">/</span><input type="number" id="v-prot-max"></div>
              </div>
              <div class="dano-cura-row">
                <input type="number" id="v-prot-delta" placeholder="Qtd">
                <button class="dc-btn dano" data-vital="prot" data-sinal="-1">Dano</button>
                <button class="dc-btn cura" data-vital="prot" data-sinal="1">Cura</button>
              </div>
            </div>
            <div class="bar-track"><div class="bar-fill protecao" id="v-prot-bar" style="width:100%"></div></div>
          </div>
          <div class="derived-card"><span class="derived-label">Deslocamento</span><input type="text" id="v-desloc-input"></div>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Atributos</h2>
        <div class="attr-mode-bar">
          <button class="mode-toggle-btn" id="btn-modo-atributo">Modo: Permanente</button>
          <button class="attr-clear-all" id="btn-limpar-temp" style="display:none">Limpar temporários</button>
        </div>
        <div class="attr-grid" id="attr-grid"></div>
      </section>
    </div>
  </div>

  <div class="actions">
    <span id="save-indicator" style="font-size:0.72rem; color:var(--text-faint); margin-right:auto; align-self:center;">salvo automaticamente</span>
    <span id="sync-indicator" style="font-size:0.72rem; color:var(--text-faint); align-self:center;"></span>
    <button class="btn" id="btn-reset">Resetar ficha</button>
    <button class="btn" id="btn-import">Importar JSON</button>
    <input type="file" id="import-input" accept="application/json" style="display:none">
    <button class="btn primary" id="btn-export">Exportar JSON</button>
  </div>
</div>

<div id="roll-log"></div>

<script>
(function(){
  "use strict";

  const LOCALSTORAGE_PREFIX = "caos_ficha_";
  const LAST_ACTIVE_KEY = "caos_ultimo_personagem_id";
  const SESSION_KEY = "personagem_ativo_id";

  const ATRIBUTOS_DEF = [
    { chave:"forca", nome:"Força", categoria:"fisica" },
    { chave:"agilidade", nome:"Agilidade", categoria:"fisica" },
    { chave:"vigor", nome:"Vigor", categoria:"fisica" },
    { chave:"mente", nome:"Mente", categoria:"mental" },
    { chave:"influencia", nome:"Influência", categoria:"mental" },
    { chave:"instinto", nome:"Instinto", categoria:"mental" },
  ];

  const PERICIAS_DEF = {
    fisicas: [
      { nome:"Atletismo", atributoBase:"forca" }, { nome:"Acrobacia", atributoBase:"agilidade" },
      { nome:"Furtividade", atributoBase:"agilidade" }, { nome:"Crime", atributoBase:"agilidade" },
      { nome:"Reflexos", atributoBase:"agilidade" }, { nome:"Prestidigitação", atributoBase:"agilidade" },
      { nome:"Pilotagem", atributoBase:"agilidade" }, { nome:"Concentração", atributoBase:"vigor" },
      { nome:"Fortitude", atributoBase:"vigor" },
    ],
    mentais: [
      { nome:"Arcanismo", atributoBase:"mente" }, { nome:"Medicina", atributoBase:"mente" },
      { nome:"História", atributoBase:"mente" }, { nome:"Investigação", atributoBase:"mente" },
      { nome:"Natureza", atributoBase:"mente" }, { nome:"Táticas", atributoBase:"mente" },
      { nome:"Vontade", atributoBase:"mente" }, { nome:"Religião", atributoBase:"mente" },
      { nome:"Avaliação", atributoBase:"instinto" }, { nome:"Observar", atributoBase:"instinto" },
      { nome:"Ouvir", atributoBase:"instinto" }, { nome:"Procurar", atributoBase:"instinto" },
      { nome:"Sentir", atributoBase:"instinto" }, { nome:"Intuição", atributoBase:"instinto" },
      { nome:"Atuação", atributoBase:"influencia" }, { nome:"Intimidação", atributoBase:"influencia" },
      { nome:"Persuasão", atributoBase:"influencia" }, { nome:"Sedução", atributoBase:"influencia" },
      { nome:"Eloquência", atributoBase:"influencia" },
    ]
  };

  let aplicandoAtualizacaoRemota = false;
  let pararEscutaMesa = null;
  let modoAtributoTemporario = false;

  function estadoPadrao(){
    const atributos = {};
    ATRIBUTOS_DEF.forEach(a => atributos[a.chave] = { pontos: 1 });
    const pericias = { fisicas:[], mentais:[], oficio:{ escolhido:"", isOficio:true } };
    ["fisicas","mentais"].forEach(cat=>{
      pericias[cat] = PERICIAS_DEF[cat].map(p => ({ nome:p.nome, atributoBase:p.atributoBase, treinado:false, expert:false }));
    });
    return {
      id: "p" + Date.now() + "_" + Math.floor(Math.random()*10000),
      atualizadoEm: null,
      idMesa: null,
      identidade:{ nome:"", classe:"Sicário", subclasse:"Arcanista", antecedente:"", oficio:"", nivel:1, proficiencia:1, cansaco:0, exaustao:0, foto:null },
      atributos,
      pericias,
      recursos:{ pvAtual:10, pvMaximo:10, protAtual:0, protMaximo:0, dt:"16", deslocamento:"10m" },
      inventario: [], habilidades: [], talentos: [], tecnicas: [], atalhos: [], historicoRolagens: [], anotacoes: []
    };
  }

  function carregarPersonagem(id){
    try{
      const raw = localStorage.getItem(LOCALSTORAGE_PREFIX + id);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  let estado = (function(){
    const id = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(LAST_ACTIVE_KEY);
    const carregado = id ? carregarPersonagem(id) : null;
    if(carregado){ sessionStorage.setItem(SESSION_KEY, carregado.id); return carregado; }
    const novo = estadoPadrao();
    sessionStorage.setItem(SESSION_KEY, novo.id);
    return novo;
  })();

  function salvar(){
    estado.atualizadoEm = Date.now();
    localStorage.setItem(LOCALSTORAGE_PREFIX + estado.id, JSON.stringify(estado));
    localStorage.setItem(LAST_ACTIVE_KEY, estado.id);
    sessionStorage.setItem(SESSION_KEY, estado.id);
    document.getElementById("save-indicator").textContent = "salvo " + new Date().toLocaleTimeString("pt-BR");
    sincronizarFirebase();
  }

  function atualizarIndicadorConexao(){
    const el = document.getElementById("sync-indicator");
    if(!el) return;
    if(!firebaseOk) el.textContent = "🔴 modo local (Firebase off)";
    else if(!estado.idMesa) el.textContent = "🔴 sem mesa";
    else el.textContent = "🟢 conectado em " + estado.idMesa;
  }

  function escutarPersonagemRemoto(){
    if(pararEscutaMesa){ pararEscutaMesa(); pararEscutaMesa = null; }
    if(!firebaseOk || !estado.idMesa){ atualizarIndicadorConexao(); return; }

    pararEscutaMesa = escutarJogadoresDaMesa(estado.idMesa, (jogadores)=>{
      const remoto = jogadores && jogadores[estado.id];
      if(!remoto) return;
      if((remoto.atualizadoEm || 0) > (estado.atualizadoEm || 0)){
        aplicandoAtualizacaoRemota = true;
        estado = remoto;
        localStorage.setItem(LOCALSTORAGE_PREFIX + estado.id, JSON.stringify(estado));
        render();
        aplicandoAtualizacaoRemota = false;
      }
    });
    atualizarIndicadorConexao();
  }

  function sincronizarFirebase(){
    if(!firebaseOk || !estado.idMesa || aplicandoAtualizacaoRemota) return;
    conectarJogadorMesa(estado.idMesa, estado).catch(()=>{});
  }

  function valorEfetivoAtributo(chave){
    const a = estado.atributos[chave] || { pontos:1 };
    return Math.max(0, (a.pontos || 1) + (a.modTemp || 0));
  }

  function formulaPericia(p){
    if(p.isOficio) return "Automático";
    const qtd = valorEfetivoAtributo(p.atributoBase);
    const prof = estado.identidade.proficiencia;
    let f = `${qtd}d10`;
    if(p.treinado) f += p.expert ? ` + ${prof*6} (${prof}d6 máx)` : ` + ${prof}d6`;
    return f;
  }

  function mostrarResultado(nome, resultado){
    const log = document.getElementById("roll-log");
    const toast = document.createElement("div");
    toast.className = "roll-toast";
    let detalhe = "";
    if(resultado.sucessoAutomatico){
      toast.innerHTML = `<div class="rt-title">${nome}</div><div class="rt-total">✓ Sucesso Automático</div>`;
    } else {
      detalhe = resultado.breakdown || `→ d10:[${resultado.d10s.join(", ")}] ${resultado.d6s && resultado.d6s.length ? "d6:["+resultado.d6s.join(", ")+"]" : ""} ${resultado.bonus ? "+"+resultado.bonus : ""}`;
      toast.innerHTML = `<div class="rt-title">${nome}</div><div class="rt-total">${resultado.total}</div><div class="rt-breakdown">${resultado.formula} ${detalhe}</div>`;
    }
    log.appendChild(toast);
    setTimeout(()=> toast.remove(), 6000);

    estado.historicoRolagens.unshift({
      nome, total: resultado.total, formula: resultado.formula || "", detalhe, hora: new Date().toLocaleTimeString("pt-BR")
    });
    if(estado.historicoRolagens.length > 50) estado.historicoRolagens.length = 50;
    salvar();

    if(firebaseOk && estado.idMesa){
      firebase.database().ref(`mesas/${estado.idMesa}/rolagens`).push({
        personagemId: estado.id, personagemNome: estado.identidade.nome || "Sem Nome",
        nomeTeste: nome, total: resultado.total ?? null, formula: resultado.formula || "",
        detalhe, timestamp: Date.now()
      }).catch(()=>{});
    }
  }

  function renderAtributos(){
    const grid = document.getElementById("attr-grid");
    grid.innerHTML = "";
    ATRIBUTOS_DEF.forEach(def => {
      const a = estado.atributos[def.chave] || { pontos:1 };
      const base = a.pontos || 1;
      const modTemp = a.modTemp || 0;
      const efetivo = valorEfetivoAtributo(def.chave);
      const card = document.createElement("div");
      card.className = `attr-card ${def.categoria}`;
      card.innerHTML = `
        <div class="attr-name">${def.nome}</div>
        <div class="attr-value">${base}${modTemp !== 0 ? ` <span class="efetivo ${modTemp > 0 ? "buff" : "debuff"}">(${efetivo})</span>` : ""}</div>
        <div class="attr-dice">${efetivo}d10</div>
        <div class="attr-controls">
          <button class="step-btn" data-attr="${def.chave}" data-step="-1">–</button>
          <button class="step-btn" data-attr="${def.chave}" data-step="1">+</button>
        </div>`;
      grid.appendChild(card);
    });

    grid.querySelectorAll("[data-attr]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const chave = btn.dataset.attr;
        const step = parseInt(btn.dataset.step,10);
        if(!estado.atributos[chave]) estado.atributos[chave] = { pontos:1 };
        if(modoAtributoTemporario){
          estado.atributos[chave].modTemp = Math.max(-10, Math.min(10, (estado.atributos[chave].modTemp || 0) + step));
        } else {
          estado.atributos[chave].pontos = Math.max(0, Math.min(20, (estado.atributos[chave].pontos || 1) + step));
        }
        render(); salvar();
      });
    });
  }

  function renderPericias(cat, containerId){
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    (estado.pericias[cat] || []).forEach((p, idx)=>{
      const row = document.createElement("div");
      row.className = "pericia-row";
      row.innerHTML = `
        <div class="pericia-nome">${p.nome}<span class="attrtag">${p.atributoBase}</span></div>
        <label class="toggle"><input type="checkbox" data-cat="${cat}" data-idx="${idx}" data-field="treinado" ${p.treinado?"checked":""}> Treinado</label>
        <label class="toggle"><input type="checkbox" data-cat="${cat}" data-idx="${idx}" data-field="expert" ${p.expert?"checked":""} ${!p.treinado?"disabled":""}> Expert</label>
        <div class="formula">${formulaPericia(p)}</div>
        <button class="roll-btn" data-cat="${cat}" data-idx="${idx}">Rolar</button>`;
      container.appendChild(row);
    });

    container.querySelectorAll("input[type=checkbox]").forEach(chk=>{
      chk.addEventListener("change", ()=>{
        const cat = chk.dataset.cat, idx = chk.dataset.idx, field = chk.dataset.field;
        estado.pericias[cat][idx][field] = chk.checked;
        if(field === "treinado" && !chk.checked) estado.pericias[cat][idx].expert = false;
        render(); salvar();
      });
    });

    container.querySelectorAll(".roll-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const p = estado.pericias[btn.dataset.cat][btn.dataset.idx];
        const qtd = valorEfetivoAtributo(p.atributoBase);
        const prof = estado.identidade.proficiencia;
        const d10s = Array.from({length: Math.max(qtd,0)}, () => 1 + Math.floor(Math.random()*10));
        let d6s = [], bonus = 0;
        if(p.treinado){
          if(p.expert) bonus = prof * 6;
          else d6s = Array.from({length: Math.max(prof,0)}, () => 1 + Math.floor(Math.random()*6));
        }
        const total = d10s.reduce((a,b)=>a+b,0) + d6s.reduce((a,b)=>a+b,0) + bonus;
        mostrarResultado(p.nome, { total, formula: formulaPericia(p), d10s, d6s, bonus });
      });
    });
  }

  function renderOficio(){
    const container = document.getElementById("pericias-oficio");
    const nome = estado.identidade.oficio || "Nenhum ofício definido";
    container.innerHTML = `
      <div class="pericia-row">
        <div class="pericia-nome">${nome}<span class="attrtag">sucesso automático</span></div>
        <span></span><span></span>
        <div class="formula">Automático</div>
        <button class="roll-btn oficio" id="btn-testar-oficio" ${!estado.identidade.oficio ? "disabled" : ""}>Testar</button>
      </div>`;
    const btn = document.getElementById("btn-testar-oficio");
    if(btn){
      btn.onclick = ()=> mostrarResultado(nome, { sucessoAutomatico:true });
    }
  }

  let invForm = false, habForm = false, tecForm = false, talForm = false, ataForm = false;

  function renderInventario(){
    const grid = document.getElementById("item-grid");
    grid.innerHTML = "";
    if(invForm){
      grid.innerHTML = `
        <div class="item-add-form">
          <input type="text" id="novo-item-nome" placeholder="Nome do item">
          <div class="item-form-row">
            <select id="novo-item-raridade"><option value="comum">Comum</option><option value="incomum">Incomum</option><option value="raro">Raro</option><option value="muitoraro">Muito Raro</option><option value="epico">Épico</option><option value="lendario">Lendário</option></select>
            <input type="number" id="novo-item-peso" placeholder="Peso (kg)" step="0.1">
          </div>
          <textarea id="novo-item-desc" placeholder="Descrição"></textarea>
          <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button class="btn" id="canc-inv">Cancelar</button><button class="btn primary" id="salv-inv">Salvar</button>
          </div>
        </div>`;
      document.getElementById("canc-inv").onclick = ()=>{ invForm = false; renderInventario(); };
      document.getElementById("salv-inv").onclick = ()=>{
        const nome = document.getElementById("novo-item-nome").value.trim();
        if(!nome) return;
        estado.inventario.push({
          nome, raridade: document.getElementById("novo-item-raridade").value,
          peso: parseFloat(document.getElementById("novo-item-peso").value) || 0,
          descricao: document.getElementById("novo-item-desc").value.trim(), aberta: false
        });
        invForm = false; renderInventario(); salvar();
      };
      return;
    }
    const add = document.createElement("div");
    add.className = "item-add-card"; add.textContent = "+ Adicionar item";
    add.onclick = ()=>{ invForm = true; renderInventario(); };
    grid.appendChild(add);

    estado.inventario.forEach((item, idx)=>{
      const card = document.createElement("div");
      card.className = "item-card" + (item.aberta ? " expandido" : "");
      card.innerHTML = `
        <div class="item-header">
          <span class="item-chevron">${item.aberta ? "▾" : "▸"}</span>
          <span class="item-nome raridade-${item.raridade}">${item.nome}</span>
          <span class="item-peso">${item.peso}kg</span>
        </div>
        ${item.aberta ? `<div class="item-body"><div class="item-raridade-tag raridade-${item.raridade}">${item.raridade}</div><div class="item-desc-text">${item.descricao||"Sem descrição."}</div><div class="item-footer-actions"><button class="item-action remover" data-del="${idx}">Remover</button></div></div>` : ""}`;
      card.querySelector(".item-header").onclick = ()=>{ item.aberta = !item.aberta; renderInventario(); };
      const del = card.querySelector("[data-del]");
      if(del) del.onclick = (e)=>{ e.stopPropagation(); estado.inventario.splice(idx,1); renderInventario(); salvar(); };
      grid.appendChild(card);
    });
  }

  function renderHabilidades(){
    const grid = document.getElementById("hab-grid");
    grid.innerHTML = "";
    if(habForm){
      grid.innerHTML = `
        <div class="item-add-form">
          <input type="text" id="novo-hab-nome" placeholder="Nome da habilidade">
          <div class="item-form-row">
            <select id="novo-hab-tipo"><option value="classe">Classe</option><option value="extranatural">Extranatural</option><option value="herdada">Herdada</option></select>
            <input type="number" id="novo-hab-nv" placeholder="Nível" value="1">
          </div>
          <textarea id="novo-hab-desc" placeholder="Descrição"></textarea>
          <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button class="btn" id="canc-hab">Cancelar</button><button class="btn primary" id="salv-hab">Salvar</button>
          </div>
        </div>`;
      document.getElementById("canc-hab").onclick = ()=>{ habForm = false; renderHabilidades(); };
      document.getElementById("salv-hab").onclick = ()=>{
        const nome = document.getElementById("novo-hab-nome").value.trim();
        if(!nome) return;
        estado.habilidades.push({
          nome, tipo: document.getElementById("novo-hab-tipo").value,
          nivel: parseInt(document.getElementById("novo-hab-nv").value,10) || 1,
          descricao: document.getElementById("novo-hab-desc").value.trim(), aberta: false
        });
        habForm = false; renderHabilidades(); salvar();
      };
      return;
    }
    const add = document.createElement("div");
    add.className = "item-add-card"; add.textContent = "+ Adicionar habilidade";
    add.onclick = ()=>{ habForm = true; renderHabilidades(); };
    grid.appendChild(add);

    estado.habilidades.forEach((hab, idx)=>{
      const card = document.createElement("div");
      card.className = "item-card" + (hab.aberta ? " expandido" : "");
      card.innerHTML = `
        <div class="item-header">
          <span class="item-chevron">${hab.aberta ? "▾" : "▸"}</span>
          <span class="item-nome tipo-${hab.tipo}">${hab.nome}</span>
          <span class="item-meta">Nv. ${hab.nivel}</span>
        </div>
        ${hab.aberta ? `<div class="item-body"><div class="item-tipo-tag tipo-${hab.tipo}">${hab.tipo}</div><div class="item-desc-text">${hab.descricao||"Sem descrição."}</div><div class="item-footer-actions"><button class="item-action remover" data-del="${idx}">Remover</button></div></div>` : ""}`;
      card.querySelector(".item-header").onclick = ()=>{ hab.aberta = !hab.aberta; renderHabilidades(); };
      const del = card.querySelector("[data-del]");
      if(del) del.onclick = (e)=>{ e.stopPropagation(); estado.habilidades.splice(idx,1); renderHabilidades(); salvar(); };
      grid.appendChild(card);
    });
  }

  function renderTecnicas(){
    const list = document.getElementById("tecnica-grid");
    list.innerHTML = "";
    if(tecForm){
      list.innerHTML = `
        <div class="item-add-form">
          <input type="text" id="novo-tec-nome" placeholder="Nome da técnica">
          <select id="novo-tec-tipo"><option value="tecnica">Técnica</option><option value="estilo">Estilo de Luta</option></select>
          <textarea id="novo-tec-desc" placeholder="Descrição"></textarea>
          <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button class="btn" id="canc-tec">Cancelar</button><button class="btn primary" id="salv-tec">Salvar</button>
          </div>
        </div>`;
      document.getElementById("canc-tec").onclick = ()=>{ tecForm = false; renderTecnicas(); };
      document.getElementById("salv-tec").onclick = ()=>{
        const nome = document.getElementById("novo-tec-nome").value.trim();
        if(!nome) return;
        estado.tecnicas.push({
          nome, tipo: document.getElementById("novo-tec-tipo").value,
          descricao: document.getElementById("novo-tec-desc").value.trim(), aberta: false
        });
        tecForm = false; renderTecnicas(); salvar();
      };
      return;
    }
    const add = document.createElement("div");
    add.className = "item-add-card"; add.textContent = "+ Adicionar técnica";
    add.onclick = ()=>{ tecForm = true; renderTecnicas(); };
    list.appendChild(add);

    estado.tecnicas.forEach((tec, idx)=>{
      const card = document.createElement("div");
      card.className = "item-card";
      card.innerHTML = `
        <div class="item-header">
          <span class="item-chevron">${tec.aberta ? "▾" : "▸"}</span>

  // Foto / Avatar com Crop
  let cropImg = null, cropScale = 1, cropMinScale = 1, cropOffX = 0, cropOffY = 0, arrastando = false, arrStart = {x:0, y:0, ox:0, oy:0};
  const CROP_VIEWPORT = 260;

  function abrirModalCrop(dataUrl){
    const img = new Image();
    img.onload = ()=>{
      cropImg = img;
      cropMinScale = Math.max(CROP_VIEWPORT / img.naturalWidth, CROP_VIEWPORT / img.naturalHeight);
      cropScale = cropMinScale;
      cropOffX = 0; cropOffY = 0;
      const el = document.getElementById("crop-image");
      el.src = dataUrl;
      el.style.width = img.naturalWidth + "px";
      el.style.height = img.naturalHeight + "px";
      document.getElementById("crop-zoom-slider").value = 100;
      atualizarTransformCrop();
      document.getElementById("modal-editar-foto").classList.add("aberto");
    };
    img.src = dataUrl;
  }

  function atualizarTransformCrop(){
    document.getElementById("crop-image").style.transform = `translate(-50%, -50%) translate(${cropOffX}px, ${cropOffY}px) scale(${cropScale})`;
  }

  const cropVp = document.getElementById("crop-viewport");
  cropVp.onpointerdown = (e)=>{
    if(!cropImg) return;
    arrastando = true; cropVp.classList.add("arrastando");
    cropVp.setPointerCapture(e.pointerId);
    arrStart = { x: e.clientX, y: e.clientY, ox: cropOffX, oy: cropOffY };
  };
  cropVp.onpointermove = (e)=>{
    if(!arrastando) return;
    cropOffX = arrStart.ox + (e.clientX - arrStart.x);
    cropOffY = arrStart.oy + (e.clientY - arrStart.y);
    atualizarTransformCrop();
  };
  cropVp.onpointerup = ()=>{ arrastando = false; cropVp.classList.remove("arrastando"); };

  document.getElementById("crop-zoom-slider").oninput = (e)=>{
    if(!cropImg) return;
    cropScale = cropMinScale * (parseInt(e.target.value,10)/100);
    atualizarTransformCrop();
  };

  document.getElementById("btn-fechar-crop").onclick = ()=> document.getElementById("modal-editar-foto").classList.remove("aberto");
  document.getElementById("btn-aplicar-crop").onclick = ()=>{
    if(!cropImg) return;
    const canvas = document.createElement("canvas");
    canvas.width = 360; canvas.height = 360;
    const ctx = canvas.getContext("2d");
    const ratio = 360 / CROP_VIEWPORT;
    ctx.translate(180 + cropOffX*ratio, 180 + cropOffY*ratio);
    ctx.scale(cropScale*ratio, cropScale*ratio);
    ctx.drawImage(cropImg, -cropImg.naturalWidth/2, -cropImg.naturalHeight/2);
    estado.identidade.foto = canvas.toDataURL("image/jpeg", 0.85);
    document.getElementById("modal-editar-foto").classList.remove("aberto");
    render(); salvar();
  };

      const r = new FileReader();
      r.onload = (evt)=> abrirModalCrop(evt.target.result);

  };

  render();
  salvar();
  if(estado.idMesa) escutarPersonagemRemoto();
})();
</script>
